[binaries]
c = 'i686-w64-mingw32-clang'
cpp = 'i686-w64-mingw32-clang++'
ar = 'i686-w64-mingw32-ar'
ld = 'i686-w64-mingw32-ld'
strip = 'i686-w64-mingw32-strip'
ranlib = 'i686-w64-mingw32-ranlib'
windres = 'i686-w64-mingw32-windres'
dlltool = 'i686-w64-mingw32-dlltool'
pkg-config = 'false'
# exe_wrapper = 'wine'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = true
# 注意：c11/threads.h 模拟层在 mingw 下直接调 pthread_*（clock_gettime64 也
# 在 winpthread 里），所以链接必须 -lwinpthread。cross-file [properties] 里写
# c_link_args 不生效（meson 不读），要用 setup/configure 的
# -Dc_link_args=-lwinpthread -Dcpp_link_args=-lwinpthread（build_turnip.sh 已带）。
